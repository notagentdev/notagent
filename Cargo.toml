[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.53"
edition = "2024"
rust-version = "1.98"
license = "MIT"

# Dependency versions live here. Crates inherit them with
# `dep = { workspace = true }`.
[workspace.dependencies]
# --- Internal crates ---
notagent-agent = { path = "crates/notagent-agent" }
notagent-ai = { path = "crates/notagent-ai" }
notagent-client = { path = "crates/notagent-client" }
notagent-protocol = { path = "crates/notagent-protocol" }
notagent-server = { path = "crates/notagent-server" }
notagent-session-sqlite = { path = "crates/notagent-session-sqlite" }
notagent-telemetry = { path = "crates/notagent-telemetry" }
notagent-tui = { path = "crates/notagent-tui" }

# --- Runtime / async ---
tokio = { version = "1.53", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "fs",
    "process",
    "signal",
    "io-util",
    "io-std",
    "net",
] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
bytes = "1"

# --- Serialization ---
# preserve_order keeps schemas and settings rewrites deterministic.
# raw_value permits precise number serialization.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
# Maintained YAML support for mode, skill, and prompt-template frontmatter.
serde_yaml_ng = "0.10"

# --- Network ---
# Binaries install an explicit rustls crypto provider because reqwest and the
# AWS SDK enable different providers in the same process.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
    "stream",
    "gzip",
    "brotli",
    "deflate",
] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
aws-config = { version = "1.10", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = { version = "1.139", features = ["behavior-version-latest"] }

# --- Persistence ---
rusqlite = { version = "0.40", features = ["bundled"] }
fs4 = { version = "1.1", features = ["sync"] }

# --- Codebase index ---
notagent-index = { path = "crates/notagent-index" }
bincode = "1.3"
dashmap = "7.0.0-rc2"
fs2 = "0.4"
nucleo-matcher = "0.3"
rayon = "1.10"
tantivy = "0.22"
tracing = "0.1.44"
twox-hash = "2"

# --- Text / Unicode / diff / search ---
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
similar = { version = "3.1", features = ["inline"] }
globset = "0.4"
ignore = "0.4"
# toml: the declarative bash-filter definitions are TOML documents.
toml = "0.9"
# rmcp: the official Rust MCP SDK, pinned at the version the reference pins.
# The surface used is connect, list, call, cancel and close.
rmcp = { version = "0.10.0", features = [
    "client",
    "transport-child-process",
    "transport-sse-client",
    "transport-sse-client-reqwest",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "auth",
    # The server half, for lending this agent's own tools to an external one
    # over a loopback endpoint.
    "server",
    "transport-streamable-http-server",
] }
# oauth2: rmcp's OAuth types are this crate's, and stored credentials have to
# be converted into and out of them.
oauth2 = "5.0"
# axum: the HTTP server rmcp's streamable-http server transport mounts into.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
regex = "1"

# --- tree-sitter ---
tree-sitter = "0.26.9"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.26"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

# --- Miscellaneous ---
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
image = "0.25"
# notify drives theme and configuration live reload.
notify = "6"
rand = "0.10"
semver = "1"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1.24", features = ["v4", "v7", "serde"] }

# --- Platform ---
libc = "0.2"
windows-sys = "0.61"

# --- Test helpers ---
tempfile = "3"
# VT emulator used by the virtual test terminal.
vt100 = "0.16"

# Line tables retain file and line information in panic backtraces without the
# storage cost of full DWARF debug information.
[profile.dev]
debug = "line-tables-only"
