[package]
name = "notagent-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Differenzielle Terminal-Rendering-Engine und Komponenten."

[features]
# Provides `test_terminal::VirtualTerminal` for interactive end-to-end tests.
test-terminal = ["dep:vt100"]

[dependencies]
async-trait = { workspace = true }
regex = { workspace = true }
unicode-segmentation = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
vt100 = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
# Selbstverweis, damit `cargo test` das Feature `test-terminal` aktiviert.
notagent-tui = { path = ".", features = ["test-terminal"] }
serde_json = { workspace = true }
tokio = { workspace = true }
