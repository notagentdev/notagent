[package]
name = "notagent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Interactive coding agent (binary) — port of packages/coding-agent."

[lib]
name = "notagent"
path = "src/lib.rs"

[[bin]]
name = "notagent"
path = "src/main.rs"

[dependencies]
notagent-agent = { workspace = true }
notagent-ai = { workspace = true }
notagent-client = { workspace = true }
notagent-protocol = { workspace = true }
notagent-tui = { workspace = true }
dirs = { workspace = true }
libc = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
