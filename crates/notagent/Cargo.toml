[package]
name = "notagent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Interactive coding agent (binary) — port of packages/coding-agent."

[lib]
name = "notagent"
path = "src/lib.rs"

[[bin]]
name = "notagent"
path = "src/main.rs"

[dependencies]
notagent-agent = { workspace = true }
notagent-ai = { workspace = true }
notagent-client = { workspace = true }
notagent-protocol = { workspace = true }
notagent-tui = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
image = { workspace = true }
dirs = { workspace = true }
libc = { workspace = true }
# notify: OS file watcher behind the theme live reload (interface request A-6).
notify = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
similar = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-bash = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-css = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-highlight = { workspace = true }
tree-sitter-html = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-ruby = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-typescript = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
unicode-normalization = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
dirs = { workspace = true }
# Needed by the ported theme suites in tests/ (workstream A, plan task 15).
futures = { workspace = true }
# test-terminal: VirtualTerminal for the ported custom-editor suite.
notagent-tui = { workspace = true, features = ["test-terminal"] }
tempfile = { workspace = true }
tokio = { workspace = true }
