[package]
name = "notagent-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multi-Provider-LLM-Layer (Streaming, Auth, Modellkatalog)."

[dependencies]
notagent-telemetry = { workspace = true }
serde = { workspace = true }
# `float_roundtrip` makes the parser exact: without it serde_json can be one ULP off,
# which would corrupt costs and other floats read back from session files.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
