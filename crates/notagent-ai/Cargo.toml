[package]
name = "notagent-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multi-Provider-LLM-Layer (Streaming, Auth, Modellkatalog)."

[dependencies]
notagent-telemetry = { workspace = true }
serde = { workspace = true }
# `float_roundtrip` makes the parser exact: without it serde_json can be one ULP off,
# which would corrupt costs and other floats read back from session files.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
dirs = { workspace = true }
# WHATWG URL parsing for the Azure base-URL normalization (TS uses `new URL()`).
url = "2"
tokio-tungstenite = { workspace = true }
# The Codex backend accepts zstd-compressed request bodies on the SSE endpoint.
zstd = "0.13"
aws-config = { workspace = true }
aws-sdk-bedrockruntime = { workspace = true }
aws-smithy-types = "1"
# The Bedrock transport branches TS handles with a `NodeHttpHandler` (proxy,
# forced HTTP/1.1) need the SDK's HTTP-client traits and the `http` crate types.
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
http = "1"

[dev-dependencies]
aws-config = { workspace = true }
aws-sdk-bedrockruntime = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
